---
name: Bug report
description: Create a report to help us improve ViAI.
labels: [bug]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting issues of ViAI!

        If you want to report a security issue, do not report it here publicly,
        see SECURITY.md.

        Problems with syntax, indent and other runtime files can be reported here.
        When ViAI has not changed the file, you may be asked to report the problem
        to its maintainer or to Vim.

        To make it easier for us to help you please enter detailed information below.
  - type: textarea
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
        4.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behaviour
      placeholder: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: input
    attributes:
      label: Version of ViAI
      description: >
        Including the patch levels of ViAI and Vim, use ":version" to see them
        [e.g. 1.0.0003, Vim 9.2.1186]
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Does it also happen in Vim?
      description: >
        If it does, please report it to Vim as well
        (https://github.com/vim/vim/issues), and put a link to that issue in
        this report.
      options:
        - "Yes"
        - "No"
        - "Not checked"
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: >
        OS [e.g. Ubuntu 21.10], terminal [e.g. GNOME Terminal 3.38.1], value of $TERM, shell [e.g. bash 5.1.8]; anything that might matter
      placeholder: |
        Operating system:
        Terminal:
        Value of $TERM:
        Shell:
    validations:
      required: true
  - type: textarea
    attributes:
      label: Logs and stack traces
      placeholder: Insert log or other text here (if necessary)
      render: shell
