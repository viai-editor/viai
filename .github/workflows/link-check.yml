# .github/workflows/link-check.yml
name: Check Links
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0' # Every Sunday at 02:00 UTC
jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Run Lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --config ci/lychee.toml .
