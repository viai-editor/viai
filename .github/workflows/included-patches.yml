# Adds the Vim patches merged into master to included_patches[] in
# src/version.c, and the declined ones as comments, see
# tools/update-included-patches.sh.  The commit is pushed
# to master directly, so that the nightly build of viai-win32-installer
# finds the numbers; that workflow waits until this one has finished.

name: Included patches

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# One run at a time, a running one is never cancelled.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    # Don't push to master of forks.
    if: ${{ github.repository_owner == 'viai-editor' }}

    permissions:
      contents: write # to push the commit

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: master
          # All commit messages are read.
          fetch-depth: 0

      - name: Add imported Vim patches to included_patches[]
        env:
          USER_NAME: "github-actions[bot]"
          USER_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
        run: |
          git config user.name "$USER_NAME"
          git config user.email "$USER_EMAIL"
          # A push to master after the checkout makes "git push" fail, try
          # again on the new master.
          for i in 1 2 3; do
            changed=$(tools/update-included-patches.sh)
            if [ -z "$changed" ]; then
              echo "No changes to included_patches[]."
              exit 0
            fi
            # Prints "patch A" or "patches A, B and C" for the numbers
            # followed by "$1" (empty for added numbers).
            patches() {
              printf '%s\n' "$changed" | awk -v kind="$1" '
                { n = $1; $1 = ""; sub(/^ /, "") }
                $0 == kind { p[++c] = n }
                END {
                  for (i = 1; i <= c; i++)
                    s = s (i == 1 ? "" : i == c ? " and " : ", ") p[i]
                  if (c > 0)
                    print (c == 1 ? "patch " : "patches ") s
                }'
            }
            added=$(patches "")
            declined=$(patches declined)
            not_declined=$(patches "not declined")
            problem=
            solution=
            if [ -n "$added" ]; then
              subject="has('patch-...') is false for imported Vim patches"
              problem="has('patch-...') is false and :version does not list"
              problem="$problem the imported Vim $added."
              solution="Add $added to included_patches[]."
            elif [ -n "$declined" ]; then
              subject="included_patches[] does not show declined Vim patches"
            else
              subject="included_patches[] shows Vim patches as declined"
            fi
            if [ -n "$declined" ]; then
              case $declined in
                patches*) as="as comments" ;;
                *) as="as a comment" ;;
              esac
              problem="$problem  included_patches[] does not show the"
              problem="$problem declined Vim $declined."
              solution="$solution  Add $declined to included_patches[] $as."
            fi
            if [ -n "$not_declined" ]; then
              problem="$problem  included_patches[] shows the Vim"
              problem="$problem $not_declined as declined."
              solution="$solution  Remove the comment for $not_declined."
            fi
            # Prints "$2" after the label "$1", folded and indented.
            wrap() {
              echo "$2" | fold -s -w 62 |
                sed -e 's/^ *//' -e 's/ *$//' \
                  -e "1s/^/$1/" -e '2,$s/^/          /'
            }
            {
              echo "$subject"
              echo
              wrap "Problem:  " "$problem"
              wrap "Solution: " "$solution"
            } > "$RUNNER_TEMP/msg"
            git commit -a -F "$RUNNER_TEMP/msg"
            if git push origin HEAD:master; then
              exit 0
            fi
            git fetch origin master
            git reset --hard origin/master
          done
          exit 1
