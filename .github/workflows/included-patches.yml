# Adds the Vim patches merged into master to included_patches[] in
# src/version.c, see tools/update-included-patches.sh.  The commit is pushed
# to master directly, so that the nightly build of viai-win32-installer
# finds the numbers; that workflow waits until this one has finished.

name: Included patches

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# One run at a time, a running one is never cancelled.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    # Don't push to master of forks.
    if: ${{ github.repository_owner == 'viai-editor' }}

    permissions:
      contents: write # to push the commit

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: master
          # All commit messages are read.
          fetch-depth: 0

      - name: Add imported Vim patches to included_patches[]
        env:
          USER_NAME: "github-actions[bot]"
          USER_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
        run: |
          git config user.name "$USER_NAME"
          git config user.email "$USER_EMAIL"
          # A push to master after the checkout makes "git push" fail, try
          # again on the new master.
          for i in 1 2 3; do
            added=$(tools/update-included-patches.sh)
            if [ -z "$added" ]; then
              echo "No patches to add."
              exit 0
            fi
            list=$(printf '%s\n' "$added" | awk '
              { p[NR] = $0 }
              END {
                for (i = 1; i <= NR; i++)
                  s = s (i == 1 ? "" : i == NR ? " and " : ", ") p[i]
                print s
              }')
            if [ "$(printf '%s\n' "$added" | wc -l)" -eq 1 ]; then
              patches="patch $list"
              them=it
            else
              patches="patches $list"
              them=them
            fi
            {
              echo "has('patch-...') is false for imported Vim patches"
              echo
              echo "has('patch-...') is false and :version does not list the" \
                "imported Vim $patches." | fold -s -w 62 |
                sed -e 's/ *$//' -e '1s/^/Problem:  /' -e '2,$s/^/          /'
              echo "Solution: Add $them to included_patches[]."
            } > "$RUNNER_TEMP/msg"
            git commit -a -F "$RUNNER_TEMP/msg"
            if git push origin HEAD:master; then
              exit 0
            fi
            git fetch origin master
            git reset --hard origin/master
          done
          exit 1
